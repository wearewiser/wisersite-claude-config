name: Claude Code

on:
  workflow_call:
    secrets:
      ANTHROPIC_API_KEY:
        required: true

jobs:
  claude:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      issues: write
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Install shared Claude config
        run: |
          git clone https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/wearewiser/wisersite-claude-config.git /tmp/wisersite-claude-config
          mkdir -p .claude/agents
          cp -r /tmp/wisersite-claude-config/agents/* .claude/agents/
          if [ -d /tmp/wisersite-claude-config/docs/ADR ]; then
            mkdir -p .claude/adr
            cp -r /tmp/wisersite-claude-config/docs/ADR/* .claude/adr/
          fi
          # Copy guardrails and inject an import into CLAUDE.md so Claude
          # auto-loads them in this CI session. Agents that reference section 18
          # of the guardrails (eg dod-guardian, which STOPs if the file is
          # unreachable) rely on this being present.
          if [ -d /tmp/wisersite-claude-config/guardrails ]; then
            mkdir -p .claude/guardrails
            cp -r /tmp/wisersite-claude-config/guardrails/* .claude/guardrails/
            GUARDRAILS_IMPORT="@.claude/guardrails/DEVELOPMENT_GUARDRAILS.md"
            if [ -f CLAUDE.md ] && grep -qxF "$GUARDRAILS_IMPORT" CLAUDE.md; then
              :
            elif [ -f CLAUDE.md ]; then
              printf '\n%s\n' "$GUARDRAILS_IMPORT" >> CLAUDE.md
            else
              printf '%s\n' "$GUARDRAILS_IMPORT" > CLAUDE.md
            fi
          fi

      - name: Run Claude
        uses: anthropics/claude-code-action@v1
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          github_token: ${{ secrets.GITHUB_TOKEN }}
          trigger_phrase: "@claude"
          claude_args: "--model claude-sonnet-4-6"
          settings: '{"permissions":{"allow":["Bash(gh pr comment*)","Bash(gh pr view*)","Bash(gh pr diff*)","Bash(gh pr list*)","Bash(git diff*)","Read(*)"]}}'
          prompt: |
            Review pull request #${{ github.event.pull_request.number }} in this repository.
            Use `gh pr diff ${{ github.event.pull_request.number }}` to get the diff and `gh pr view ${{ github.event.pull_request.number }} --json title,body,files` for context.
            Be concise — maximum 5 bullet points total.
            Flag only: (1) bugs that would break behaviour, (2) security issues, (3) clear violations of patterns already established in this repo.
            Skip style nits, minor naming, and anything that works but could be marginally cleaner.
            If you find issues, post a comment using `gh pr comment ${{ github.event.pull_request.number }} --body "..."` listing them as bullet points — one short sentence each, prefixed with the file and line number if relevant.
            If you find nothing to flag, post a comment using `gh pr comment ${{ github.event.pull_request.number }} --body "✅ Looks good. No issues found."`
