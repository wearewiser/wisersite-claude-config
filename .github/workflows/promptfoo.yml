name: Agent regression tests

on:
  push:
    paths:
      - 'agents/**'
  pull_request:
    paths:
      - 'agents/**'

jobs:
  promptfoo:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run dor-guardian tests
        run: npx promptfoo eval --config promptfoo/dor-guardian.yaml
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}

      - name: Run dod-guardian tests
        run: npx promptfoo eval --config promptfoo/dod-guardian.yaml
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}

      - name: Run branch-guardian tests
        run: npx promptfoo eval --config promptfoo/branch-guardian.yaml
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
