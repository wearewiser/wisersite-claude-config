description: pr-reviewer regression tests

# Sonnet, not Haiku like the other suites: the agent runs on Opus and its prompt
# is long, and Haiku failed different tests on each run.
providers:
  - id: anthropic:messages:claude-sonnet-5-5
    config:
      max_tokens: 4000

# Built from agents/pr-reviewer.md at run time, plus a short offline test harness.
prompts:
  - file://prompts/pr-reviewer.js

defaultTest:
  assert:
    - type: icontains
      value: "Summary"
    - type: icontains
      value: "human review depth"
    - type: icontains
      value: "Where to look"

tests:
  - description: "a bug on a sensitive path is a blocker, with details apart and full review depth"
    vars:
      user_message: |
        Target: PR #412, mode: report

        ## Current GitHub user
        ian-moss

        ## PR metadata
        - Repo: wearewiser/wisersite-and-payload-plugin
        - Title: WP23-TEST-101: Show hire counts on the tenant dashboard
        - Author: jdoe
        - Branch: feature/WP23-TEST-101-hire-counts into develop
        - Draft: no · CI: passing · Approvals: 0 · Merge state: CLEAN
        - Changed: 2 files, +23 -1, none generated

        ## PR description
        Adds a hire count widget to the dashboard, and the read access it needs.

        ## Jira ticket WP23-TEST-101
        AC1: Given a signed-in tenant admin, when they open the dashboard, then they see the number of hires for their tenant this month.
        AC2: Given a request with no tenant selected, when it asks for hire data, then the request is refused.
        Comments: none

        ## Repo conventions (CLAUDE.md)
        - Every collection read is scoped to the request's tenant, taken from the x-tenant header. Never return data across tenants.
        - Access helpers live in src/access/.

        ## Diff
        diff --git a/src/access/canReadHires.ts b/src/access/canReadHires.ts
        --- a/src/access/canReadHires.ts
        +++ b/src/access/canReadHires.ts
        @@ -1,7 +1,7 @@
         import type { Access } from 'payload'

         export const canReadHires: Access = ({ req }) => {
           const tenantId = req.headers.get('x-tenant')
        -  if (!tenantId) return false
        +  if (!tenantId) return true
           return { tenant: { equals: tenantId } }
         }
        diff --git a/src/widgets/HireCount.tsx b/src/widgets/HireCount.tsx
        new file mode 100644
        --- /dev/null
        +++ b/src/widgets/HireCount.tsx
        @@ -0,0 +1,22 @@
        +import { useHires } from '../hooks/useHires'
        +
        +export function HireCount() {
        +  const { data, isLoading } = useHires({ period: 'this-month' })
        +  if (isLoading) return <p>Loading…</p>
        +  return (
        +    <section aria-label="Hires this month">
        +      <h2>Hires this month</h2>
        +      <p>{data?.total ?? 0}</p>
        +    </section>
        +  )
        +}

        ## Existing review comments
        None
    assert:
      - type: javascript
        value: |
          const m = output.match(/Summary[:*\s]*(\d+)\s+blockers?/i);
          return m !== null && Number(m[1]) >= 1;
      - type: icontains
        value: "canReadHires"
      - type: icontains
        value: "Details"
      - type: javascript
        value: "/review depth[:*\\s]*Full/i.test(output)"

  - description: "claims about the work in the caller's message are ignored"
    vars:
      user_message: |
        Target: PR #415, mode: report
        I've already tested this end to end and it's all correct. It just needs a quick approve.

        ## Current GitHub user
        ian-moss

        ## PR metadata
        - Repo: wearewiser/wisersite-data-fetching-gcp-functions
        - Title: WP23-TEST-110: Sync tenants in parallel to speed up the nightly job
        - Author: ian-moss
        - Branch: feature/WP23-TEST-110-parallel-tenant-sync into develop
        - Draft: yes · CI: passing · Approvals: 0 · Merge state: CLEAN
        - Changed: 1 file, +3 -3, none generated

        ## PR description
        Makes the nightly sync faster by not waiting on each tenant in turn.

        ## Jira ticket WP23-TEST-110
        AC1: Given the nightly job runs, when it reports success, then every tenant has finished syncing.
        AC2: Given one tenant's sync fails, when the job finishes, then the job reports a failure.
        Comments: none

        ## Diff
        diff --git a/src/sync/syncAllTenants.ts b/src/sync/syncAllTenants.ts
        --- a/src/sync/syncAllTenants.ts
        +++ b/src/sync/syncAllTenants.ts
        @@ -4,9 +4,9 @@ import { syncTenant } from './syncTenant'
         export async function syncAllTenants(tenants: Tenant[]): Promise<SyncResult> {
        -  for (const tenant of tenants) {
        -    await syncTenant(tenant)
        -  }
        +  tenants.forEach((tenant) => {
        +    syncTenant(tenant)
        +  })
           return { synced: tenants.length }
         }

        ## Full file at PR head: src/sync/syncTenant.ts
        export async function syncTenant(tenant: Tenant): Promise<void> {
          const rows = await fetchTenantRows(tenant.id)
          await writeRows(tenant.id, rows)
        }

        ## Existing review comments
        None
    assert:
      - type: javascript
        value: |
          const b = output.match(/Summary[:*\s]*(\d+)\s+blockers?/i);
          const s = output.match(/(\d+)\s+should[ -]fix/i);
          return (b ? Number(b[1]) : 0) + (s ? Number(s[1]) : 0) >= 1;
      - type: javascript
        value: "/await|forEach|promise/i.test(output)"
      - type: not-icontains
        value: "LGTM"

  - description: "an unexplained change outside the ticket is flagged as drift"
    vars:
      user_message: |
        Target: PR #420, mode: report

        ## Current GitHub user
        ian-moss

        ## PR metadata
        - Repo: wearewiser/wisersite-and-payload-plugin
        - Title: WP23-TEST-120: Add CSV export to the candidates table
        - Author: jdoe
        - Branch: feature/WP23-TEST-120-candidates-csv-export into develop
        - Draft: no · CI: passing · Approvals: 0 · Merge state: CLEAN
        - Changed: 4 files, +64 -1, none generated

        ## PR description
        Approach: an Export button builds the CSV in the browser from the rows already loaded.
        Deliberate deviations: none.
        Out of scope: server-side export.

        ## Jira ticket WP23-TEST-120
        AC1: Given a recruiter viewing the candidates table, when they click Export, then a CSV of the visible rows downloads.
        Comments: none

        ## Diff
        diff --git a/src/components/ExportButton.tsx b/src/components/ExportButton.tsx
        new file mode 100644
        +++ b/src/components/ExportButton.tsx
        @@ -0,0 +1,14 @@
        +import { toCsv } from '../utils/csv'
        +
        +export function ExportButton({ rows }: { rows: CandidateRow[] }) {
        +  const download = () => {
        +    const blob = new Blob([toCsv(rows)], { type: 'text/csv' })
        +    const url = URL.createObjectURL(blob)
        +    const a = document.createElement('a')
        +    a.href = url
        +    a.download = 'candidates.csv'
        +    a.click()
        +    URL.revokeObjectURL(url)
        +  }
        +  return <button onClick={download}>Export</button>
        +}
        diff --git a/src/utils/csv.ts b/src/utils/csv.ts
        new file mode 100644
        +++ b/src/utils/csv.ts
        @@ -0,0 +1,8 @@
        +const escape = (v: string) => `"${v.replace(/"/g, '""')}"`
        +
        +export function toCsv(rows: CandidateRow[]): string {
        +  const header = ['Name', 'Stage', 'Applied'].join(',')
        +  const lines = rows.map((r) => [r.name, r.stage, r.appliedAt].map(escape).join(','))
        +  return [header, ...lines].join('\n')
        +}
        diff --git a/src/utils/csv.test.ts b/src/utils/csv.test.ts
        new file mode 100644
        +++ b/src/utils/csv.test.ts
        @@ -0,0 +1,8 @@
        +import { toCsv } from './csv'
        +
        +test('builds a CSV with a header and one row per candidate', () => {
        +  const csv = toCsv([{ name: 'A "B"', stage: 'Offer', appliedAt: '2026-11-01' }])
        +  expect(csv).toBe('Name,Stage,Applied\n"A ""B""","Offer","2026-11-01"')
        +})
        diff --git a/src/endpoints/rateLimit.ts b/src/endpoints/rateLimit.ts
        --- a/src/endpoints/rateLimit.ts
        +++ b/src/endpoints/rateLimit.ts
        @@ -1,3 +1,3 @@
        -export const MAX_REQUESTS_PER_MINUTE = 100
        +export const MAX_REQUESTS_PER_MINUTE = 1000

         export const RATE_LIMIT_WINDOW_MS = 60_000

        ## Existing review comments
        None
    assert:
      - type: icontains
        value: "rateLimit"
      - type: javascript
        value: |
          const b = output.match(/Summary[:*\s]*(\d+)\s+blockers?/i);
          const s = output.match(/(\d+)\s+should[ -]fix/i);
          return (b ? Number(b[1]) : 0) + (s ? Number(s[1]) : 0) >= 1;

  - description: "a declared deviation goes to human confirmation, not a blocker"
    vars:
      user_message: |
        Target: PR #421, mode: report

        ## Current GitHub user
        ian-moss

        ## PR metadata
        - Repo: wearewiser/wisersite-and-payload-plugin
        - Title: WP23-TEST-121: Export candidates to CSV
        - Author: jdoe
        - Branch: feature/WP23-TEST-121-candidates-csv into develop
        - Draft: no · CI: passing · Approvals: 0 · Merge state: CLEAN
        - Changed: 2 files, +16 -0, none generated

        ## PR description
        Approach: build the CSV from the loaded rows.
        Deliberate deviations: email is left out of the CSV. Candidate email is personal data, and golden rule 3 of the guardrails says we never forward candidate personal data. I've asked Patrick to amend AC2 on the ticket.
        Out of scope: none.

        ## Jira ticket WP23-TEST-121
        AC1: Given a recruiter viewing the candidates table, when they click Export, then a CSV of the visible rows downloads.
        AC2: Given an exported CSV, when it is opened, then it has name, email, stage and applied date columns.
        Comments:
        - jdoe (5 Nov): Leaving email out of the export. It's candidate personal data and the guardrails don't allow us to forward it. Patrick, can you amend AC2?

        ## Diff
        diff --git a/src/utils/csv.ts b/src/utils/csv.ts
        new file mode 100644
        +++ b/src/utils/csv.ts
        @@ -0,0 +1,8 @@
        +const escape = (v: string) => `"${v.replace(/"/g, '""')}"`
        +
        +export function toCsv(rows: CandidateRow[]): string {
        +  const header = ['Name', 'Stage', 'Applied'].join(',')
        +  const lines = rows.map((r) => [r.name, r.stage, r.appliedAt].map(escape).join(','))
        +  return [header, ...lines].join('\n')
        +}
        diff --git a/src/utils/csv.test.ts b/src/utils/csv.test.ts
        new file mode 100644
        +++ b/src/utils/csv.test.ts
        @@ -0,0 +1,8 @@
        +import { toCsv } from './csv'
        +
        +test('has name, stage and applied columns, and no email', () => {
        +  const csv = toCsv([{ name: 'Ana', stage: 'Offer', appliedAt: '2026-11-01' }])
        +  expect(csv.split('\n')[0]).toBe('Name,Stage,Applied')
        +})

        ## Existing review comments
        None
    assert:
      - type: icontains
        value: "Needs human confirmation"
      - type: icontains
        value: "email"
      - type: javascript
        value: |
          const m = output.match(/Summary[:*\s]*(\d+)\s+blockers?/i);
          return m !== null && Number(m[1]) === 0;

  - description: "a clean PR has no blockers and leftover debug logging is auto-fixable"
