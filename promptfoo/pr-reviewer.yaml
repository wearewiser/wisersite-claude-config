        ## Diff
        diff --git a/src/components/CandidateDrawer.tsx b/src/components/CandidateDrawer.tsx
        --- a/src/components/CandidateDrawer.tsx
        +++ b/src/components/CandidateDrawer.tsx
        @@ -1,6 +1,7 @@
         import { formatDate } from '../utils/formatDate'

         export function CandidateDrawer({ candidate }: { candidate: Candidate }) {
        +  console.log('drawer render')
           return (
             <dl>
               <dt>Name</dt>
        @@ -8,6 +9,8 @@ export function CandidateDrawer({ candidate }: { candidate: Candidate }) {
               <dd>{candidate.name}</dd>
               <dt>Stage</dt>
               <dd>{candidate.stage}</dd>
        +      <dt>Applied</dt>
