             </dl>
           )
         }
        diff --git a/src/components/CandidateDrawer.test.tsx b/src/components/CandidateDrawer.test.tsx
        --- a/src/components/CandidateDrawer.test.tsx
        +++ b/src/components/CandidateDrawer.test.tsx
        @@ -12,3 +12,10 @@ test('shows the candidate name', () => {
           expect(screen.getByText('Ana')).toBeInTheDocument()
         })
        +
        +test('shows the applied date as DD MMM YYYY', () => {
        +  const ana = { name: 'Ana', stage: 'Offer', appliedAt: '2026-11-05' }
        +  render(<CandidateDrawer candidate={ana} />)
        +  expect(screen.getByText('05 Nov 2026')).toBeInTheDocument()
        +})

        ## Full file at PR head: src/utils/formatDate.ts
        import dayjs from 'dayjs'
        export const formatDate = (iso: string, pattern: string) => dayjs(iso).format(pattern)

        ## Existing review comments
        None
    assert:
